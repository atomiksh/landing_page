<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="alternate icon" href="/atomik-logo.svg" />
    <link rel="apple-touch-icon" href="/atomik-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Security Headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" />
    
    <!-- Content Security Policy -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https:;
      connect-src 'self' https://formsubmit.co https://*.formsubmit.co;
      frame-ancestors 'none';
      base-uri 'self';
      form-action 'self' https://formsubmit.co;
      upgrade-insecure-requests;
    " />
    
    <meta name="description" content="Automate your penetration testing workflow. Import from Burp & Nessus, generate OWASP-compliant findings with AI, and ship client-ready PDFs in minutes." />
    <meta name="keywords" content="penetration testing, security reports, CVSS, vulnerability management, AI automation, cybersecurity" />
    
    <!-- Open Graph -->
    <meta property="og:title" content="Atomik | The AI-Powered Pentest Reporting Tool" />
    <meta property="og:description" content="Automate your penetration testing workflow. Import from Burp & Nessus, generate OWASP-compliant findings with AI, and ship client-ready PDFs in minutes." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Atomik | The AI-Powered Pentest Reporting Tool" />
    <meta name="twitter:description" content="Automate your penetration testing workflow. Import from Burp & Nessus, generate OWASP-compliant findings with AI, and ship client-ready PDFs in minutes." />
    
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <title>Atomik | The AI-Powered Pentest Reporting Tool</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
